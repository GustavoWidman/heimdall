[package]
name = "heimdall"
version = "0.5.0"
edition = "2024"
description = "heimdall: the watchman for your context switches"
license = "MIT"

[dependencies]
argon2 = "0.6"
axum = "0.8"
base64 = "0.23.1"
clap = { version = "4.6", features = ["derive", "env"] }
eyre = "0.6.14"
getrandom = "0.4.3"
rpassword = "7"
rusqlite = { version = "0.41", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.154", features = ["raw_value"] }
sha2 = "0.11.1"
tokio = { version = "1.54", features = ["macros", "rt-multi-thread", "net", "sync", "time", "io-std", "io-util", "signal"] }
tokio-stream = { version = "0.1.19", features = ["sync"] }
tower-http = { version = "0.7", features = ["fs", "compression-gzip", "compression-br"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }

[dev-dependencies]
http-body-util = "0.1.5"
tempfile = "3.27.0"
tower = { version = "0.5.3", features = ["util"] }

# Password hashing is far too slow unoptimized for the login tests.
[profile.dev.package.argon2]
opt-level = 3

[profile.dev.package.blake2]
opt-level = 3
