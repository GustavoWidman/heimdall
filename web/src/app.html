<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
		<meta name="text-scale" content="scale" />
		<meta name="theme-color" content="#f3f2ee" media="(prefers-color-scheme: light)" />
		<meta name="theme-color" content="#0c0c0d" media="(prefers-color-scheme: dark)" />
		<meta name="apple-mobile-web-app-capable" content="yes" />
		<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
		<meta name="apple-mobile-web-app-title" content="heimdall" />
		<meta name="mobile-web-app-capable" content="yes" />
		<link rel="manifest" href="/manifest.webmanifest" />
		<link rel="apple-touch-icon" href="/apple-touch-icon.png" />
		<title>heimdall</title>
		<script>
			try {
				var t = localStorage.getItem('heimdall-theme');
				if (t === 'light' || t === 'dark') {
					document.documentElement.dataset.theme = t;
					document.querySelectorAll('meta[name="theme-color"]').forEach(function (m) {
						m.content = t === 'dark' ? '#0c0c0d' : '#f3f2ee';
					});
				}
			} catch (e) {}
		</script>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
